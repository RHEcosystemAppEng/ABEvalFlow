# Agentic Eval Flow Konflux Secrets Template
#
# Apply these secrets to your Konflux tenant namespace. Not all secrets are
# required -- it depends on which eval-mode and features you use.
#
# Required secrets by mode:
#   EVAL_MODE=local  : llm-credentials (if LLM proxy requires a real API key)
#   EVAL_MODE=remote : llm-credentials + workload-cluster-credentials
#
# Optional secrets (for additional features):
#   compass-facts-api      : Push scorecard facts to Red Hat Compass
#   ab-eval-db-credentials : Store results in PostgreSQL
#   minio-credentials      : Upload artifacts to MinIO/S3
#   monitoring-slack-webhook: Send degradation alerts to Slack
#   promptfoo-cloud-credentials: Share red-team results to Promptfoo Cloud (optional)
#   a2a-agent-credentials  : Bearer token for JWT-protected A2A agents (eval-engine=a2a only)
---
# workload-cluster-credentials
# ONLY required when EVAL_MODE=remote (cross-cluster evaluation).
# Contains a ServiceAccount token from the workload cluster.
#
# To create the SA and token on the workload cluster:
#   oc create sa abevalflow-deployer -n <your-namespace>
#   oc adm policy add-role-to-user edit -z abevalflow-deployer -n <your-namespace>
#   oc create token abevalflow-deployer -n <your-namespace> --duration=8760h
apiVersion: v1
kind: Secret
metadata:
  name: workload-cluster-credentials
  namespace: <YOUR-KONFLUX-TENANT-NAMESPACE>
type: Opaque
stringData:
  token: "<REPLACE_WITH_WORKLOAD_CLUSTER_SA_TOKEN>"
---
# llm-credentials
# API key for the LLM proxy. When using LiteLLM proxy (which handles real
# auth to providers like Vertex AI), set this to "sk-dummy".
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  namespace: <YOUR-KONFLUX-TENANT-NAMESPACE>
type: Opaque
stringData:
  api-key: "<REPLACE_WITH_LLM_API_KEY>"
---
# compass-facts-api (OPTIONAL)
# Bearer token for the Red Hat Compass Soundcheck Facts API.
# If not configured, scorecard is computed but facts are not pushed.
apiVersion: v1
kind: Secret
metadata:
  name: compass-facts-api
  namespace: <YOUR-KONFLUX-TENANT-NAMESPACE>
type: Opaque
stringData:
  token: "<REPLACE_WITH_COMPASS_API_TOKEN>"
---
# a2a-agent-credentials (OPTIONAL)
# Bearer token for JWT-protected A2A agents. Only used when eval-engine=a2a
# and the target agent requires authentication. If this secret doesn't
# exist, no Authorization header is sent (unchanged default behavior).
apiVersion: v1
kind: Secret
metadata:
  name: a2a-agent-credentials
  namespace: <YOUR-KONFLUX-TENANT-NAMESPACE>
type: Opaque
stringData:
  token: "<REPLACE_WITH_A2A_AGENT_JWT>"
---
# promptfoo-cloud-credentials (OPTIONAL)
# API key for Promptfoo Cloud to share red-team results.
# If not configured, red-team runs locally without cloud sharing.
# Only relevant when ENABLE_RED_TEAM=true.
apiVersion: v1
kind: Secret
metadata:
  name: promptfoo-cloud-credentials
  namespace: <YOUR-KONFLUX-TENANT-NAMESPACE>
type: Opaque
stringData:
  api-key: "<REPLACE_WITH_PROMPTFOO_API_KEY>"
