name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          ruff check abevalflow/ scripts/ tests/
          ruff format --check abevalflow/ scripts/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_mlflow_observer.py

  test-observability:
    name: test (observability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,observability]"

      - name: Run MLflow observer tests
        run: pytest tests/test_mlflow_observer.py -v --tb=short
